<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <!-- Age gate cover: unverified visitors see a blurred page from the first frame, never the
         page itself. AgeGateModal removes it once its own backdrop is on screen. -->
    <script>
      (function () {
        var html = document.documentElement;
        try {
          var saved = JSON.parse(localStorage.getItem('elitebud-age-verification-v1') || 'null');
          if (saved && saved.state && saved.state.isAgeVerified === true) return;
        } catch (e) {}
        html.classList.add('age-gate-pending');
        // Failsafe: if the app never mounts, do not leave the page stuck behind the blur.
        setTimeout(function () { html.classList.remove('age-gate-pending'); }, 10000);
      })();
    </script>
    <style>
      /* Identical to the AgeGateModal backdrop (bg-charcoal/60 backdrop-blur-xl), one layer under it (z-50). */
      html.age-gate-pending::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 49;
        background-color: #20212499;
        /* autoprefixer: ignore next */
        -webkit-backdrop-filter: blur(24px);
        backdrop-filter: blur(24px);
      }
    </style>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="canonical" href="https://elitebud.ca/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>EliteBud | Premium Same-Day Cannabis Delivery Abbotsford, BC</title>
    <meta name="title" content="EliteBud | Premium Same-Day Cannabis Delivery Abbotsford, BC" />
    <meta name="description" content="Best Bud In Town. Ultra-premium same-day cannabis delivery across Abbotsford, Mission, Chilliwack & Langley. Fulfillment in 1–3 hours. Free delivery over $50." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://elitebud.ca/" />
    <meta property="og:title" content="EliteBud | Luxury Same-Day Cannabis Delivery" />
    <meta property="og:description" content="Best Bud In Town. Ultra-premium same-day cannabis delivery across Abbotsford within 1-3 hours. Interac E-Transfer & COD accepted." />
    <meta property="og:image" content="https://elitebud.ca/logo.png" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://elitebud.ca/" />
    <meta property="twitter:title" content="EliteBud | Luxury Same-Day Cannabis Delivery" />
    <meta property="twitter:description" content="Best Bud In Town. Ultra-premium same-day cannabis delivery across Abbotsford within 1-3 hours." />
    <meta property="twitter:image" content="https://elitebud.ca/logo.png" />

    <!-- Fonts: Inter & Instrument Serif -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-white text-charcoal antialiased selection:bg-forest selection:text-white font-sans overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
